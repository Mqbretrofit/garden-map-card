type: custom:garden-map-card
entity: sensor.robot_funyiro_anthbot_map
name: Kert
image: /local/garden-map-card/garden.png?v=1
mowed_path_color: rgba(255, 235, 59, 0.82)
mowed_path_width: 10
show_mowed_coverage: true
mowed_coverage_width: 360
mowed_path_source: auto
fit: cover
mobile_map_rotation: 90
mobile_map_fit: contain
mobile_robot_size: 24
refresh_interval: 3
default_system: robot
entities:
  battery: sensor.robot_funyiro_anthbot_battery_level
  status: sensor.robot_funyiro_anthbot_mower_status
  charging: binary_sensor.robot_funyiro_anthbot_charging
controls:
  start: button.robot_funyiro_anthbot_start_full_mow
  stop: button.robot_funyiro_anthbot_stop_mow
  dock: button.robot_funyiro_anthbot_return_to_dock
calibration: { offsetX: -0.01, offsetY: -0.03, scaleX: 1.28, scaleY: 1.18, rotation: 1.570797 }
robotCalibration: { offsetX: 0.0043, offsetY: 0, scaleX: 0.5, rotation: 4.656893 }
decodedBoundaryCalibration: { offsetX: -0.01, offsetY: -0.002, scaleX: 1.04, scaleY: 1.02, rotation: 0 }
boundary_width: 3
boundary_color: rgba(74, 101, 255, 0.9)
show_decoded_boundary: false
show_zones: false
show_no_go_zones: true
show_no_go_labels: true
robot_heading_source: cloud
irrigation:
  type: custom:irrigation-map-card
  name: Locsolorendszer
  language: auto
  zones:
    - { id: 1, name: "Zona 1", entity: switch.6_zonas_intelligens_szelepvezerlo_1_aljzat, color: "#38bdf8" }
    - { id: 2, name: "Zona 2", entity: switch.6_zonas_intelligens_szelepvezerlo_2_aljzat, color: "#22c55e" }
