name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: contains(github.event.head_commit.message, '[release v160]')
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v160" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Garden Map Card v160" \
            --notes "Adds three-stage Anthbot command feedback for direct button controls and service fallbacks: command sent, cloud accepted, and robot state confirmed. Includes automatic Anthbot service-domain selection and improved status matching across legacy, Genie Plus, and Anthbot Map integrations."
