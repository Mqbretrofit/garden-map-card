name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: contains(github.event.head_commit.message, '[release v161.8]')
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v161.8" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Garden Map Card v161.8" \
            --notes "Adds the AWS IoT/MQTT live-shadow connection state to the existing cloud and robot status line. The indicator reads MQTT: online or MQTT: offline and preserves the user-tested v161.7 mobile, irrigation and dashboard zone editor behavior."
