name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: contains(github.event.head_commit.message, '[rebuild release v161.4]')
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "v161.4" \
            --repo "${GITHUB_REPOSITORY}" \
            --cleanup-tag \
            --yes
          gh release create "v161.4" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Garden Map Card v161.4" \
            --notes "Fixes portrait mobile map sizing, restores the correct sprinkler direction after mobile rotation, and includes animated drip-line water flow. The HACS root bundle and dist bundle are identical."
