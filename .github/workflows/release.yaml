name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: contains(github.event.head_commit.message, '[release v158.4]')
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v158.4" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Garden Map Card v158.4" \
            --notes "True HACS single-file bundle: all JavaScript modules, styles and the robot image are embedded. Also preserves YAML-defined irrigation heads when browser-local or Home Assistant user-data settings are loaded."
