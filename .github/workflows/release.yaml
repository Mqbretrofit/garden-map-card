name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: contains(github.event.head_commit.message, '[release v161.7]')
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v161.7" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Garden Map Card v161.7" \
            --notes "Publishes the exact user-tested dashboard zone editor build in both the HACS root bundle and dist bundle, together with the tested 10-zone irrigation scheduler package. Adds dashboard zone rename, add, delete, switch entity and color editing."
