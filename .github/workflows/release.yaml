name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: contains(github.event.head_commit.message, '[release v161]')
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v161" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Garden Map Card v161" \
            --notes "Completes multilingual three-stage Anthbot command feedback and translates the Robot log and irrigation editor interface. Also isolates Garden Map Card command handling from other Anthbot cards loaded on the same dashboard."
